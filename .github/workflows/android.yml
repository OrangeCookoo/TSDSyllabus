name: Android CI & APK

on:
  push:
    branches: [ "claude/tang-soo-do-app-mukklo", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TSD-Syllabus.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSD-Syllabus-apk
          path: dist/TSD-Syllabus.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: github.ref == 'refs/heads/claude/tang-soo-do-app-mukklo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Latest debug build of the Tang Soo Do Syllabus Android app.
            Download TSD-Syllabus.apk below and install on your Android device
            (you may need to allow "install from unknown sources").
        run: |
          if gh release view app-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload app-latest dist/TSD-Syllabus.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create app-latest dist/TSD-Syllabus.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "TSD Syllabus (latest build)" \
              --notes "$NOTES"
          fi

  instrumented-test:
    name: Emulator UI test
    runs-on: ubuntu-latest
    # Informational: verifies the app launches and renders on a real emulator.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
